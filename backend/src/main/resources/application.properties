# Appens namn
spring.application.name=backend

# Koppling till databasen i Docker (filmapp-db på port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/filmapp
spring.datasource.username=filmapp
spring.datasource.password=filmapp

# Hibernate skapar och uppdaterar tabellerna automatiskt utifrån våra Java-klasser
spring.jpa.hibernate.ddl-auto=update

# Visar SQL-frågorna i terminalen, bra för att förstå vad som händer
spring.jpa.show-sql=true

# Stänger databaskopplingen direkt efter varje fråga (rekommenderat för REST API)
spring.jpa.open-in-view=false

# Hemlig nyckel som används för att signera JWT-tokens.
# Om miljövariabeln JWT_SECRET finns används den, annars värdet efter kolonet.
# Värdet efter kolonet är bara för lokal utveckling och ska bytas ut i en riktig drift.
jwt.secret=${JWT_SECRET:utvecklingsnyckel-for-filmapp-byt-ut-i-produktion-1234567890}

# Hur länge en token gäller, i millisekunder (86400000 ms = 24 timmar)
jwt.expiration-ms=86400000